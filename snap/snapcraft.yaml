title: dirtboll-nim
name: dirtboll-nim
contact: 61202885+dirtboll@users.noreply.github.com
license: MIT
base: core26
version: '2.4'
summary: Nim programming language
description: |
  Unofficial Snap for Nim compiler

grade: stable
confinement: strict

parts:
  nim:
    plugin: nil
    build-packages:
    - build-essential
    - wget
    override-pull: |
      VERSION=${SNAPCRAFT_PROJECT_VERSION//./-}
      wget https://github.com/nim-lang/nightlies/releases/download/latest-version-${VERSION}/source.tar.xz
      tar -xf source.tar.xz --strip-components=1
      rm source.tar.xz
    override-build: |
      cd $CRAFT_PART_SRC
      sh build.sh
      bin/nim c -d:release koch
      ./koch boot -d:release
      ./koch tools
      cp -ra . $CRAFT_PART_INSTALL/
    stage-packages:
    - git
    - libssl-dev
    - build-essential
    - gcc
    - g++
    - libc6-dev
    - binutils

  bootstrap:
    plugin: dump
    source: .
    stage:
      - nim.cfg
      - run.sh

apps:
  dirtboll-nim:
    command: run.sh nim
    plugs: [home, network]

  nimble:
    command: run.sh nimble
    plugs: [home, network]
  
  nimsuggest:
    command: run.sh nimsuggest
    plugs: [home, network]

layout:
  /etc/nim/nim.cfg:
    bind-file: $SNAP_DATA/nim.cfg
